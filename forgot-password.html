<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Forgot Password - LoanMate</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/forgot-password.css" />
  </head>

  <body>
    <div class="container">
      <div class="forgot-card mx-auto">
        <div class="logo text-center mb-4">
          <i class="bi bi-bank2"></i>
          <span>LoanMate</span>
        </div>

        <div class="forgot-icon mx-auto mb-3">
          <i class="bi bi-lock-fill"></i>
        </div>

        <h3 class="text-center fw-bold">Forgot Password?</h3>

        <p class="text-center text-muted mb-4">
          Don't worry! Enter your registered email address. We'll help you reset
          your password.
        </p>

        <form id="forgotForm">
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">
              Email Address
            </label>

            <input
              type="email"
              id="email"
              class="form-control"
              placeholder="Enter your registered email"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary w-100">Send OTP</button>
        </form>

        <div class="text-center mt-4">
          <a href="./login.html" class="back-login">
            <i class="bi bi-arrow-left"></i>
            Back to Login
          </a>
        </div>
      </div>
    </div>

    <script>
      document
        .getElementById("forgotForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const email = document.getElementById("email").value.trim();
          const button = this.querySelector('button[type="submit"]');

          if (!email) {
            alert("Please enter your registered email.");
            return;
          }

          try {
            button.disabled = true;
            button.innerText = "Sending OTP...";

            const response = await fetch(
              "https://loanmate-backend.onrender.com/user/forgot-password",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({ email: email }),
              },
            );

            const result = await response.json();

            if (!response.ok) {
              throw new Error(result.message || "Unable to send OTP.");
            }

            sessionStorage.setItem("resetEmail", email);
            sessionStorage.removeItem("resetToken");

            alert(
              result.message || "If your account exists, an OTP will be sent.",
            );

            window.location.href = "./verify-otp.html";
          } catch (error) {
            console.error("Forgot password error:", error);
            alert(error.message || "Unable to connect to server.");
          } finally {
            button.disabled = false;
            button.innerText = "Send OTP";
          }
        });
    </script>
  </body>
</html>
