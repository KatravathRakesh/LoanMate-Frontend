<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reset Password - LoanMate</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #e8f3ff, #f5f9ff);
        font-family: Arial, sans-serif;
      }

      .reset-card {
        max-width: 430px;
        width: 100%;
        padding: 35px;
        background: #fff;
        border-radius: 15px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
      }

      .logo {
        color: #079deb;
        font-size: 28px;
        font-weight: bold;
      }

      .reset-icon {
        width: 65px;
        height: 65px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e5f3ff;
        color: #079deb;
        border-radius: 50%;
        font-size: 28px;
      }

      .form-control {
        height: 48px;
      }

      .btn {
        height: 48px;
        font-weight: 600;
      }

      @media (max-width: 480px) {
        .reset-card {
          padding: 25px 20px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="reset-card mx-auto">
        <div class="logo text-center mb-4">
          <i class="bi bi-bank2"></i> LoanMate
        </div>

        <div class="reset-icon mx-auto mb-3">
          <i class="bi bi-shield-lock-fill"></i>
        </div>

        <h3 class="text-center fw-bold">Reset Password</h3>

        <p class="text-center text-muted mb-4">
          Create a new password for your LoanMate account.
        </p>

        <form id="resetForm">
          <div class="mb-3">
            <label for="newPassword" class="form-label fw-semibold">
              New Password
            </label>

            <input
              type="password"
              id="newPassword"
              class="form-control"
              placeholder="Enter new password"
              minlength="8"
              required
            />
          </div>

          <div class="mb-3">
            <label for="confirmPassword" class="form-label fw-semibold">
              Confirm Password
            </label>

            <input
              type="password"
              id="confirmPassword"
              class="form-control"
              placeholder="Confirm new password"
              minlength="8"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary w-100">
            Reset Password
          </button>
        </form>

        <div class="text-center mt-4">
          <a href="./login.html" class="text-decoration-none">
            Back to Login
          </a>
        </div>
      </div>
    </div>

    <script>
      document
        .getElementById("resetForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const email = sessionStorage.getItem("resetEmail");
          const resetToken = sessionStorage.getItem("resetToken");

          const newPassword = document.getElementById("newPassword").value;
          const confirmPassword =
            document.getElementById("confirmPassword").value;

          const button = this.querySelector('button[type="submit"]');

          if (!email || !resetToken) {
            alert("Please verify your OTP first.");
            window.location.href = "./forgot-password.html";
            return;
          }

          if (newPassword.length < 8) {
            alert("Password must contain at least 8 characters.");
            return;
          }

          if (newPassword !== confirmPassword) {
            alert("Passwords do not match.");
            return;
          }

          try {
            button.disabled = true;
            button.innerText = "Resetting Password...";

            const response = await fetch(
              "https://loanmate-backend.onrender.com/user/reset-password",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  email: email,
                  resetToken: resetToken,
                  newPassword: newPassword,
                }),
              },
            );

            const result = await response.json();

            if (!response.ok) {
              throw new Error(result.message || "Password reset failed.");
            }

            alert("Password reset successfully! Please login.");

            sessionStorage.removeItem("resetEmail");
            sessionStorage.removeItem("resetToken");

            window.location.href = "./login.html";
          } catch (error) {
            console.error("Reset password error:", error);
            alert(error.message || "Unable to connect to server.");
          } finally {
            button.disabled = false;
            button.innerText = "Reset Password";
          }
        });
    </script>
  </body>
</html>
